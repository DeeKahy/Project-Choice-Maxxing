<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Voting app">
  <rect width="64" height="64" rx="14" fill="#4f46e5"/>
  <!-- ballot slip -->
  <rect x="16" y="12" width="32" height="40" rx="4" fill="#ffffff"/>
  <!-- lines of text on the slip -->
  <rect x="21" y="19" width="22" height="3.5" rx="1.75" fill="#c7d2fe"/>
  <rect x="21" y="27" width="22" height="3.5" rx="1.75" fill="#c7d2fe"/>
  <rect x="21" y="35" width="14" height="3.5" rx="1.75" fill="#c7d2fe"/>
  <!-- check mark -->
  <path d="M20 40 l7 7 l16 -18" fill="none" stroke="#22c55e" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
